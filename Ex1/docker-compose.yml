services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    volumes:
      - ./data:/app/data
    command: ["./myapp", "${PORT}"]

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    depends_on:
      - server
    stdin_open: true
    tty: true
    command: ["python3", "src/client.py", "server", "${PORT}"]

  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests