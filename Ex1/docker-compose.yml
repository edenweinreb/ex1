services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    volumes:
      - ./data:/app/data
    command: ["./myapp", "9090"]

  webserver:
    build:
      context: .
      dockerfile: Dockerfile.webserver
    ports:
      - "3000:3000"
    depends_on:
      - server
    # Map the local Node.js directory to the container's /app directory
    # The second line protects the container's installed node_modules
    # volumes:
    #   - ./src/EX3-NODEJS:/app
    #  - /app/node_modules
    # Explicitly run the Node.js application
    command: ["node", "app.js"]

  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    depends_on:
      - server